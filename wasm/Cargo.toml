[package]
name = "opendfm-wasm"
version = "0.1.0"
edition = "2021"
description = "Browser-side Gerber processing and DFM analysis for OpenDFM"
license = "MIT"
repository = "https://github.com/shishir-dey/OpenDFM"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
